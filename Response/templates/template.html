<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Пять поросят — детективная игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Courier New', monospace;

            height: 100vh;

        }
        /* Стили для кнопок удаления улик */
        .evidence-list-modal li {
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        .delete-evidence-btn {

        }
        .delete-evidence-btn:hover {

        }
        .clear-all-evidence {
            background: #5f4a2e;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            margin: 10px 0;
            cursor: pointer;
            color: #faf0cf;
            font-weight: bold;
            width: 100%;
        }
        .clear-all-evidence:hover {
            background: #7f6139;
        }
        .page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0c12;
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .page-card {

            margin-bottom: 1.2rem;

        .page-card p {

        .big-round-btn {

            border: none;

            padding: 12px 24px;

            font-weight: bold;

        }
        .big-round-btn:hover { background: #9e7a4a; transform: scale(1.02);}
        .double-group {

        }
        .main-game {

        }
        .round-btn {

        .suspects-grid {

        }
        .suspect-card {

            border: 1px solid #2f3a48;
            box-shadow: 0 8px 18px black;
        }
        .suspect-card.grayed {

        }
        .suspect-photo {

        .suspect-photo img {

        }
        .suspect-name { font-weight: bold; font-size: 1rem; margin-bottom: 6px; color: #e2cfac; }
        .desc-icon {

            background: #2c353f;

            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #cfc2a0;
        }

        .verdict-fixed {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #7a2e2e;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #faf0cf;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: 0.2s;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .verdict-fixed:hover { background: #9e3e3e; transform: translateX(-50%) scale(1.02); }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-window.wide-modal {
            max-width: 700px;
            width: 85%;
            max-height: 85vh;
            min-height: 450px;
            overflow-y: auto;
        }
        .modal-window {
            background: #0f141c;
            border-radius: 2rem;
            border: 1px solid #b8860b;
            max-width: 550px;
            width: 90%;

            padding: 1.5rem;
            box-shadow: 0 20px 30px black;
            word-wrap: break-word;
            color: #ececec;
        }
        .close-cross {

            right: 18px;

            color: #b9aa7a;
            z-index: 10;
        }
        .close-cross:hover { color: #e6c87a; }
        .custom-confirm {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e242c;
            border: 1px solid #c9a87b;
            border-radius: 1.5rem;
            padding: 1.2rem 1.8rem;

        .custom-confirm p {

            color: #eedba7;

        .custom-confirm-buttons {

            justify-content: center;
        }
        .custom-confirm-buttons button {
            background: #5f4a2e;
            border: none;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.9rem;
            transition: 0.1s;
            color: #faf0cf;
        }
        .custom-confirm-buttons button:first-child:hover { background: #9e3e3e; }
        .custom-confirm-buttons button:last-child:hover { background: #7f6139; }
        .dialog-window {
            width: 700px;
            max-width: 90vw;
            height: 600px;
            display: flex;
            flex-direction: column;
            background: #0e131c;
            border-radius: 2rem;
            padding: 0;
            overflow: hidden;
        }
        .chat-header-fixed {

            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #c9a064;
        }
        .chat-header-fixed h3 {
            font-size: 1.2rem;
            font-weight: bold;
            color: #eedba7;
            margin: 0;
        }
        .chat-header-finished {
            background: #4a2e2e;
            padding: 14px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #e6c8a3;
            border-bottom: 2px solid #a05a5a;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #080d14;
        }
        .msg-user {
            align-self: flex-end;
            background: #2c6e2c;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 80%;
            color: #f0f7e6;
            word-break: break-word;
        }
        .msg-ai {
            align-self: flex-start;
            background: #362812;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 80%;
            color: #f3e3be;
            cursor: pointer;
            user-select: text;
            word-break: break-word;
        }
        .msg-ai:hover { background: #5c481f; }
        .chat-input-row {
            display: flex;
            gap: 12px;
            margin: 15px;
        }
        .chat-input-row input {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            border: none;
            background: #1f2a33;
            color: #ececec;
            font-family: monospace;
        }
        .chat-input-row input:disabled {
            background: #2a2a2a;
            color: #888;
            cursor: not-allowed;
        }
        .chat-input-row button {
            background: #846b44;
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            color: #faf0cf;
        }
        .chat-input-row button:disabled {
            background: #5a4a32;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .close-dialog-btn {
            background: #7a2e2e;
            border: none;
            color: #faf0cf;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s;
        }
        .close-dialog-btn:hover { background: #9e3e3e; }
        .evidence-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .evidence-big-window {
            width: 850px;
            max-width: 90vw;
            height: 600px;
            background: #faf0cf;
            border-radius: 2rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            box-shadow: 10px 10px 0 #7f6139;
            position: relative;
        }
        .evidence-header-bar {
            background: #cbaa6b;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #a0793e;
        }
        .evidence-header-bar h3 {
            color: #2c2418;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .evidence-close-btn {
            background: #7f6139;
            border: none;
            font-size: 1.2rem;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            color: #faf0cf;
            font-weight: bold;
        }
        .evidence-body-flex {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .evidence-side-tabs {
            background: #cbaa6b;
            width: 170px;
            display: flex;
            flex-direction: column;
            padding: 1.2rem 0;
            gap: 10px;
            overflow-y: auto;
            border-right: 2px solid #a0793e;

        .evidence-tab {
            background: #e6d5ab;
            margin: 4px 12px;
            padding: 10px 8px;
            border-radius: 0 24px 24px 0;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            font-size: 0.9rem;
            transition: 0.1s;
            border: 1px solid rgba(0,0,0,0.2);

        }
        .evidence-tab.active-tab {
            background: #ffefb9;
            border-left: 6px solid #8b4513;
            color: #2c1a0c;
        }
        .evidence-tab:hover {
            background: #f5e6b3;
            color: #2c1a0c;
        }
        .evidence-paper-area {
            flex: 1;
            padding: 1.5rem;
            background: #fff5e0;
            overflow-y: auto;
            color: #3a2818;
        }
        .evidence-list-modal {
            list-style: none;
            margin-top: 15px;
        }
        .evidence-list-modal li {
            background: #fef3cf;
            margin: 10px 0;
            padding: 10px 14px;
            border-left: 6px solid #b37b2e;
            word-break: break-word;
            border-radius: 0 12px 12px 0;
            color: #3a2818;
            font-weight: 500;
        }
        .empty-evidence {
            color: #7a6848;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        .toast-notify {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2e2a1f;
            border: 1px solid #e6bc7c;
            color: #ffefbf;
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 11000;
            font-weight: bold;
            box-shadow: 0 5px 15px black;
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0);}
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
        }
        /* Стили для викторины (блок обвинения) */
        .quiz-modal-content {
            text-align: left;
        }
        .quiz-question {
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px dashed #b8860b;
        }
        .quiz-question p {
            font-weight: bold;
            color: #eedba7;
            margin-bottom: 0.5rem;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: #0f141c;
            padding: 6px 10px;
            border-radius: 20px;
        }
        .quiz-option:hover {
            background: #2a2f38;
        }
        .quiz-option input {
            accent-color: #b8860b;
            width: 16px;
            height: 16px;
        }
        #submitQuizBtn {
            background: #7f6139;
            border: none;
            border-radius: 60px;
            padding: 10px 20px;
            font-weight: bold;
            color: #faf0cf;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        #quizResult {
            margin-top: 15px;
            font-size: 1.2rem;
            text-align: center;
            padding: 10px;
            border-radius: 40px;
        }
        .quiz-win {
            background: #1a3a1a;
            color: #8bc34a;
        }
        .quiz-lose {
            background: #3a1a1a;
            color: #e57373;
        }
        .fullscreen-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1f1a0c, #000000);
            z-index: 20000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #e6c384;
        }
        .final-buttons {
            display: flex;
            gap: 30px;
            margin-top: 40px;
            justify-content: center;
        }
        .final-btn {
            background: #846b44;
            border: none;
            padding: 14px 34px;
            font-size: 1.2rem;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            color: #faf0cf;
            transition: 0.1s;
        }
        .final-btn:hover { background: #a07e52; transform: scale(1.02); }
        
        .modal-window h3 {

    </style>
    <audio id="bgMusic" loop preload="auto" volume="0.3">
        <source src="/static/sounds/background.mp3" type="audio/mpeg">
    </audio>
    <audio id="winSound" preload="auto">
        <source src="/static/sounds/win.mp3" type="audio/mpeg">
    </audio>
    <audio id="loseSound" preload="auto">
        <source src="/static/sounds/lose.mp3" type="audio/mpeg">
    </audio>
</head>

<body>
<div id="appRoot"></div>
<script>

    const openingLines = [
        "Месье Пуаро, я уже всё рассказал полиции тогда. Но если вам хочется покопаться в старых костях — ради бога. Только боюсь, вы зря теряете время.",
        "О… это очень тяжело. Я до сих пор виню себя за те разговоры о цикуте. Но если моя память поможет Карле… я постараюсь. Извините, я волнуюсь.",
        "Эмиас — моя единственная любовь. Вы правда думаете, что я могла его убить? Впрочем… задавайте свои вопросы.",
        "Я не понимаю, зачем ворошить прошлое. Но если вы хотите знать правду — что ж, я всегда смотрела ей в глаза.",
        "Месье Пуаро, я ждала этого дня шестнадцать лет. Спрашивайте всё, что хотите. Я устала молчать."
    ];
    const suspects = [
        { id: 0, name: "Филип Блейк", role: "Филип Блейк — мужчина около пятидесяти лет, в молодости был красив, хотя глаза посажены слишком близко; имеет склонность к полноте, но физически крепок и хорошо сложён. Держится уверенно, с лёгкой самоиронией, одет по-деловому, со вкусом и без излишеств.", photo: "static/филиппблейк.jpg", dialogLimit: 5, msgCount: 0, finished: false, history: [], opening: openingLines[0] },
        { id: 1, name: "Мередит Блейк", photo: "static/мередитблейк.jpg", role: "Мередит Блейк — мягкие, интеллигентные черты лица, без резкости; часто выглядит задумчивым или растерянным; носит очки для чтения, одевается старомодно, не следит за модой; сутулые плечи, неуклюжие движения от стеснительности, часто краснеет при разговоре на личные темы.", dialogLimit: 5, msgCount: 0, finished: false, history: [], opening: openingLines[1] },
        { id: 2, name: "Эльза Гриер", photo: "static/Эльзагриер.jpg", role: "Эльза Гриер — около тридцати шести лет, выглядит старше от усталости. Лицо правильной овальной формы, бледное, черты безжизненные, как маска. Большие серые глаза — «мёртвые озёра», лишь в воспоминаниях появляется блеск. Волосы чёрные, коротко стриженые, идеально уложены. Одежда элегантна и проста (тёмное платье, жемчуг). Руки изящные, ногти без лака. Осанка прямая, движения плавные, но холодные. Красота рассудочная — «сухой и колючий цветок».", dialogLimit: 5, msgCount: 0, finished: false, history: [], opening: openingLines[2] },
        { id: 3, name: "Сесилия Уильямс", photo: "static/сесилияуильямс.jpg", role: "Сесилия Уильямс — уже в годах, невысокого роста, одежда поношенная, но безупречно аккуратная; лицо строгое, без кокетства, волосы убраны — ничего лишнего; в её комнате репродукции Боттичелли и венецианские пейзажи, но сама она выглядит скорее практичной, чем мечтательной.", dialogLimit: 5, msgCount: 0, finished: false, history: [], opening: openingLines[3] },
        { id: 4, name: "Анджела Уоррен", photo: "static/анджелауоррен.jpg", role: "Анджела Уоррен — правильные, немного суровые черты лица, прекрасные чёрные брови, умные карие глаза (одий слегка перекошен, не видит — но Анджела не обращает на это внимания); нежная, белая кожа, прямые плечи, немного мальчишеская походка, на правой щеке — страшный шрам.", dialogLimit: 5, msgCount: 0, finished: false, history: [], opening: openingLines[4] }
    ];
    let evidenceMap = { 0: [], 1: [], 2: [], 3: [], 4: [] };
    let currentModal = null;
    let gameInitialized = false;
    const app = document.getElementById('appRoot');
    
    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast-notify';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }
    
    function closeModal() {
        if (currentModal) {
            currentModal.remove();
            currentModal = null;
        }
    }
    
    function showModal(html, className = '', addCloseCross = true) {
        if (currentModal) closeModal();
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        const modalDiv = document.createElement('div');
        modalDiv.className = `modal-window ${className}`;
        let closeHtml = '';
        if (addCloseCross) closeHtml = '<div class="close-cross" id="genericCloseBtn">✖</div>';
        modalDiv.innerHTML = closeHtml + html;

        currentModal = overlay;
        if (addCloseCross) {
            const closeBtn = modalDiv.querySelector('#genericCloseBtn');
            if (closeBtn) closeBtn.onclick = () => closeModal();

        }
        return modalDiv;

    function showCustomConfirm(message, onConfirm) {

    function makeEvidenceSelectable(container, suspectId) {
        if (!container) return;
        const aiMessages = container.querySelectorAll('.msg-ai');
        aiMessages.forEach(msg => {
            if (msg.hasListener) return;
            msg.addEventListener('mouseup', () => {
                const selection = window.getSelection();
                const selected = selection.toString().trim();
                if (selected.length > 0) {
                    if (!evidenceMap[suspectId]) evidenceMap[suspectId] = [];
                    evidenceMap[suspectId].push(`🔍 "${selected}"`);
                    showToast(`Улика добавлена для ${suspects.find(s=>s.id===suspectId).name}`);
                    selection.removeAllRanges();
                }
            });
            msg.hasListener = true;
        });
    }

    function openDialog(suspect) {
        if (!gameInitialized) { showToast("Сначала пройдите обучение"); return; }
        renderChatModal(suspect);
    }

    function renderChatModal(suspect) {
        if (suspect.finished) {
            showFinishedDialog(suspect);
            return;
        }

        if (suspect.history.length === 0) {
            suspect.history.push({ sender: 'ai', text: suspect.opening });
        }

        const historyHtml = suspect.history.map(msg => {
            if (msg.sender === 'user')
                return `<div class="msg-user">${escapeHtml(msg.text)}</div>`;
            else
                return `<div class="msg-ai">${escapeHtml(msg.text)}</div>`;
        }).join('');

        const modalDiv = showModal(`
            <div class="chat-header-fixed">
                <h3>🕵️ Допрос: ${suspect.name}</h3>
                <button id="forceFinishDialogBtn" class="close-dialog-btn">✖ Завершить диалог</button>
            </div>
            <div class="chat-messages" id="chatMessagesContainer">${historyHtml}</div>
            <div class="chat-input-row">
                <input type="text" id="chatMsgInput" placeholder="Введите ваш вопрос..." autocomplete="off">
                <button id="sendMsgBtn">📩 Отправить</button>
            </div>
        `, 'dialog-window', false);

        const inputField = modalDiv.querySelector('#chatMsgInput');
        const sendBtn = modalDiv.querySelector('#sendMsgBtn');
        const msgContainer = modalDiv.querySelector('#chatMessagesContainer');
        const finishBtn = modalDiv.querySelector('#forceFinishDialogBtn');

        function scrollToBottom() {
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }
        scrollToBottom();
        makeEvidenceSelectable(msgContainer, suspect.id);

        finishBtn.onclick = () => {
            showCustomConfirm(
                `Вы уверены, что хотите завершить диалог с ${suspect.name}?\n\nПосле этого вы не сможете задавать ему вопросы, но сможете просмотреть историю сообщений.`,
                () => {
                    suspect.finished = true;
                    closeModal();
                    updateMainUI();
                    showToast(`Диалог с ${suspect.name} завершён. Вы можете просмотреть историю.`);
                }
            );
        };

        function addUserMessage(text) {
            if (!text.trim()) return;

            if (suspect.msgCount >= suspect.dialogLimit) {
                suspect.finished = true;
                closeModal();
                showFinishedDialog(suspect);
                updateMainUI();
                showToast(`Допрос ${suspect.name} завершён!`);
                return;
            }

            suspect.history.push({ sender: 'user', text: text });
            suspect.msgCount++;

            const userDiv = document.createElement('div');
            userDiv.className = 'msg-user';
            userDiv.innerText = text;
            msgContainer.appendChild(userDiv);
            scrollToBottom();

            inputField.value = '';

            // Маппинг русских имён → английские ключи для сервера
            const nameMap = {
                "Филип Блейк": "Fillip",
                "Мередит Блейк": "Meredict",
                "Эльза Гриер": "Elsa",
                "Сесилия Уильямс": "Sesil",
                "Анджела Уоррен": "Angela"
            };
            const serverName = nameMap[suspect.name];
            if (!serverName) {
                showToast(`Ошибка: неизвестное имя "${suspect.name}"`);
                return;
            }

            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: serverName, question: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showToast('Ошибка: ' + data.error);
                    return;
                }

                const reply = data.answer;
                suspect.history.push({ sender: 'ai', text: reply });

                const aiDiv = document.createElement('div');
                aiDiv.className = 'msg-ai';
                aiDiv.innerText = reply;
                aiDiv.addEventListener('mouseup', () => {
                    const selected = window.getSelection().toString().trim();
                    if (selected) {
                        evidenceMap[suspect.id].push(`🔍 "${selected}"`);
                        showToast(`Улика добавлена для ${suspect.name}`);
                        window.getSelection().removeAllRanges();
                    }
                });

                msgContainer.appendChild(aiDiv);
                scrollToBottom();
                makeEvidenceSelectable(msgContainer, suspect.id);

                if (suspect.msgCount >= suspect.dialogLimit) {
                    suspect.finished = true;
                    closeModal();
                    showFinishedDialog(suspect);
                    updateMainUI();
                    showToast(`Допрос ${suspect.name} завершён!`);
                }
            })
            .catch(err => {
                showToast('Ошибка связи с сервером');
                console.error(err);
            });
        }

        sendBtn.onclick = () => {
            const txt = inputField.value.trim();
            if (txt) addUserMessage(txt);
        };
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const txt = inputField.value.trim();
                if (txt) addUserMessage(txt);
            }
        });
    }
    
    function showFinishedDialog(suspect) {
        const historyHtml = suspect.history.map(msg => {
            if (msg.sender === 'user') return `<div class="msg-user">${escapeHtml(msg.text)}</div>`;
            else return `<div class="msg-ai" style="cursor:pointer;">${escapeHtml(msg.text)}</div>`;
        }).join('');
        
        const modalDiv = showModal(`
            <div class="chat-header-finished">🔒 Допрос ${suspect.name} завершён 🔒</div>
            <div class="chat-messages" id="finishedMessages">${historyHtml || '<div>Нет сообщений</div>'}</div>
            <div class="chat-input-row">
                <input type="text" placeholder="Диалог завершён, только просмотр" disabled>
                <button disabled style="opacity:0.5;">📩</button>
            </div>
            <div style="text-align:center; padding:8px; font-size:0.8rem; color:#aa9466;">Выделите текст, чтобы добавить улику</div>
        `, 'dialog-window', true);
        
        const container = modalDiv.querySelector('.chat-messages');
        if (container) {
            const msgs = container.querySelectorAll('.msg-ai');
            msgs.forEach(msg => {
                msg.addEventListener('mouseup', () => {
                    const selected = window.getSelection().toString().trim();
                    if (selected) {
                        evidenceMap[suspect.id].push(`🔍 "${selected}"`);
                        showToast(`Улика добавлена для ${suspect.name} (из истории)`);
                        window.getSelection().removeAllRanges();
                    }
                });
            });
        }
    }
    
    let evidenceWindowOpen = false;
    function openEvidenceWindow() {
        if (!gameInitialized) { showToast("Игра не начата."); return; }
        if (evidenceWindowOpen) return;
        evidenceWindowOpen = true;
        
        let activeId = 0;
        
        function renderEvidenceList(suspectId) {
            const listContainer = document.getElementById('evidenceListModal');
            if (!listContainer) return;
            const evs = evidenceMap[suspectId] || [];
            if (evs.length === 0) {
                listContainer.innerHTML = '<div class="empty-evidence">🔎 Нет улик. Выделите фрагмент ответа подозреваемого в диалоге.</div>';
                return;
            }
            const ul = document.createElement('ul');
            ul.className = 'evidence-list-modal';
            evs.forEach((ev, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${escapeHtml(ev)}</span><button class="delete-evidence-btn" data-idx="${idx}">🗑️</button>`;
                ul.appendChild(li);
            });
            listContainer.innerHTML = '';
            listContainer.appendChild(ul);
            
            listContainer.querySelectorAll('.delete-evidence-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    evidenceMap[suspectId].splice(idx, 1);
                    renderEvidenceList(suspectId);
                    showToast(`Улика удалена`);
                    const clearBtn = document.getElementById('clearAllEvidenceBtn');
                    if (clearBtn) clearBtn.textContent = `🗑️ Очистить все улики (${suspects[activeId].name})`;
                });
            });
        }
        
        function clearAllEvidence(suspectId) {
            if (evidenceMap[suspectId].length === 0) {
                showToast(`Нет улик для удаления`);
                return;
            }
            showCustomConfirm(`Вы уверены, что хотите удалить ВСЕ улики для ${suspects[suspectId].name}?`, () => {
                evidenceMap[suspectId] = [];
                renderEvidenceList(suspectId);
                showToast(`Все улики для ${suspects[suspectId].name} удалены`);
                const clearBtn = document.getElementById('clearAllEvidenceBtn');
                if (clearBtn) clearBtn.textContent = `🗑️ Очистить все улики (${suspects[activeId].name})`;
            });
        }
        
        const overlay = document.createElement('div');
        overlay.className = 'evidence-modal-overlay';
        overlay.innerHTML = `
            <div class="evidence-big-window">
                <div class="evidence-header-bar">
                    <h3>📓 БЛОКНОТ УЛИК</h3>
                    <button class="evidence-close-btn" id="closeEvidenceBtn">✖ ЗАКРЫТЬ</button>
                </div>
                <div class="evidence-body-flex">
                    <div class="evidence-side-tabs" id="evidenceSideTabsModal"></div>
                    <div class="evidence-paper-area">
                        <button id="clearAllEvidenceBtn" class="clear-all-evidence">🗑️ Очистить все улики</button>
                        <ul class="evidence-list-modal" id="evidenceListModal"></ul>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        const tabsContainer = overlay.querySelector('#evidenceSideTabsModal');
        suspects.forEach(s => {
            const tab = document.createElement('div');
            tab.className = 'evidence-tab';
            tab.dataset.id = s.id;
            tab.innerText = `📌 ${s.name}`;
            tabsContainer.appendChild(tab);
        });
        renderEvidenceList(0);
        let clearBtn = overlay.querySelector('#clearAllEvidenceBtn');
        clearBtn.textContent = `🗑️ Очистить все улики (${suspects[0].name})`;
        clearBtn.onclick = () => clearAllEvidence(activeId);
        const tabs = overlay.querySelectorAll('.evidence-tab');
        function setActiveTab(id) {
            tabs.forEach(t => {
                const tid = parseInt(t.dataset.id);
                if (tid === id) t.classList.add('active-tab');
                else t.classList.remove('active-tab');
            });
            activeId = id;
            renderEvidenceList(id);
            clearBtn.textContent = `🗑️ Очистить все улики (${suspects[id].name})`;
            clearBtn.onclick = () => clearAllEvidence(id);
        }
        tabs.forEach(tab => {
            tab.onclick = () => {
                const id = parseInt(tab.dataset.id);
                setActiveTab(id);
            };
        });
        setActiveTab(0);
        overlay.querySelector('#closeEvidenceBtn').onclick = () => {
            overlay.remove();
            evidenceWindowOpen = false;
        };
        overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); evidenceWindowOpen = false; } };
    }
    
    function openVerdictModal() {
        const allFinished = suspects.every(s => s.finished === true);
        if (!allFinished) {

            },
            {
                text: "Кто является главным детективом в романе «Пять поросят»?",

                correct: 0
            },
            {
                text: "Как был убит Эмиас Крейл?",
                options: ["Самоубийство", "Отравление", "Смертельное ранение ножом", "остановка сердца"],
                correct: 1

                options: ["у себя в комнате", "На диване", "На работе", "В саду"],

            },
            {
                text: "Кого защищала Кэролайн?",
                options: ["Мисс Марпл", "Мередит Блейк", "Эльзу Гриер", "Анджелу Уоррен", "Сесилию Уильямс"],
                correct: 3
            }
        ];

        // Генерируем HTML викторины
        let quizHtml = `<div class="quiz-modal-content"><h3>⚖️ ВЫНЕСЕНИЕ ПРИГОВОРА</h3>
                        <p>Ответьте на вопросы, чтобы доказать свою правоту.</p>`;

                            <p>${idx+1}. ${q.text}</p>

                <p>Уважаемый месье Пуаро,
В нашем городе 16 лет назад произошло убийство. При расследовании обвинили мою мать. Но я знаю: она не виновна.
Я была совсем ребёнком, когда её забрали. Меня отправили в чужую страну, я жила под чужой фамилией и долгие годы даже не знала правды. А когда узнала — мир рухнул. Мою маму, ласковую и тихую женщину, назвали отравительницей. Она не дожила до оправдания — умерла в тюрьме через год.
Перед смертью она написала мне письмо. Месье Пуаро, она клялась, что не убивала. Умирающий человек не лжёт своей дочери. Я чувствую это сердцем.
Теперь я выросла. Я люблю и хочу замуж, хочу детей. Но я не могу начать новую жизнь, пока на моей матери остаётся это пятно. Я не могу произносить своё настоящее имя, не содрогаясь от стыда и боли.
Я молю Вас, снимите с неё эту вину. Докажите то, во что я верю всем существом. Верните мне честь моей матери, чтобы я могла жить без этой тени.
Пожалуйста. Вы — моя последняя надежда.
Карла Лемаршан</p>
                <div class="double-group"><button id="nextSynopsisBtn" class="big-round-btn">ДАЛЕЕ →</button></div>
            </div>
        `;
        document.body.appendChild(page);
        page.querySelector('#nextSynopsisBtn').onclick = () => { page.remove(); showRulesPage(); };
    }
    
    function showRulesPage() {
        const page = document.createElement('div');
        page.className = 'page-overlay';
        page.innerHTML = `
            <div class="page-card">
                <h2>📜 ПРАВИЛА ИГРЫ</h2>
                <p><strong>Англия, 1938 год. Вы — Эркюль Пуаро.</strong> Шестнадцать лет назад в поместье Олдербери был отравлен художник Эмиас Крейл. Его жена осуждена и мертва. Но её дочь просит вас найти настоящего убийцу.
<strong>Как вести расследование:</strong>
1. Перед вами пять подозреваемых. Вы можете задавать вопросы по очереди каждому из них.
2. Количество вопросов ограничено. Тратьте их с умом.
3. Если в ответе подозреваемого вы заметили улику — выделите её мышкой. Это поможет вам не упустить деталь.
4. Главное правило: вы не можете назвать убийцу, пока не опросите всех пятерых. Никаких приговоров до последнего слова.
5. Когда вопросы закончены, а все голоса выслушаны — произнесите одно имя. Это будет ваш вердикт.
Удачи, месье Пуаро. И пусть ваши серые клеточки не подведут.</p>
                <div class="double-group"><button id="backSynopsisBtn" class="big-round-btn" style="background:#5f4a2e;">◀ НАЗАД</button><button id="startGameBtn" class="big-round-btn">▶ НАЧАТЬ ИГРУ</button></div>
            </div>
        `;
        document.body.appendChild(page);
        page.querySelector('#backSynopsisBtn').onclick = () => { page.remove(); showSynopsisPage(); };
        page.querySelector('#startGameBtn').onclick = () => { page.remove(); gameInitialized = true; renderMainScreen(); };
    }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    startOnboarding();
</script>
